services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5437:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data/   
    env_file:
      - .env

volumes:
  postgres_data:
    name: monitor_passagens_pgdata
